name: Deploy QuestDesigner

on:
  push:
    branches:
      - implement-3d-map-questdesigner
      - main  # 💡 Added this so it updates when you merge into your main branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoids getting multiple broken build queues if you push multiple times rapidly
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      # 🛠️ Fixed the URL mapping here so GitHub UI prints the link accurately
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment # 🛠️ This step ID passes outputs up to the job environment block
        uses: actions/deploy-pages@v4vvvvvvvvvvvvvvvvvvvvvvvvvvv
